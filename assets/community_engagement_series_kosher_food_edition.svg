<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Community Engagement Series: Kosher Food Edition</title>
  <desc id="desc">Hero image for a community engagement article connecting kosher food, local communities, and machine learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1f33"/>
      <stop offset="48%" stop-color="#173d52"/>
      <stop offset="100%" stop-color="#28533f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .series { font-family: Arial, Helvetica, sans-serif; font-size: 38px; font-weight: 700; fill: #b8fff0; letter-spacing: 2px; text-transform: uppercase; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 92px; font-weight: 900; fill: #ffffff; letter-spacing: -2px; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 36px; font-weight: 600; fill: #e8f7f4; }
      .tag { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #102033; }
      .nodeText { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #ffffff; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 600; fill: #d9eee9; }
      .line { stroke: #b8fff0; stroke-width: 5; stroke-opacity: 0.55; stroke-linecap: round; }
      .thinLine { stroke: #f7d794; stroke-width: 3; stroke-opacity: 0.65; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <circle cx="100" cy="120" r="220" fill="#ffffff" opacity="0.05"/>
  <circle cx="1505" cy="790" r="280" fill="#ffffff" opacity="0.06"/>
  <circle cx="1240" cy="120" r="110" fill="#f7d794" opacity="0.10"/>

  <g opacity="0.33">
    <path d="M80 760 C295 680, 445 750, 650 640 S1050 500, 1288 590 S1510 610, 1580 480" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M0 690 C220 610, 430 658, 610 540 S1020 420, 1260 512 S1480 520, 1600 388" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <g transform="translate(105 96)">
    <text x="0" y="0" class="series">Community Engagement Series</text>
    <text x="0" y="112" class="title">Kosher Food</text>
    <text x="0" y="204" class="title">Edition</text>
    <text x="4" y="270" class="subtitle">Connecting communities through food and machine learning</text>
  </g>

  <g transform="translate(1010 92)" filter="url(#shadow)">
    <rect x="0" y="0" rx="30" ry="30" width="430" height="110" fill="#f7d794"/>
    <text x="34" y="68" class="tag">Community Data</text>
  </g>
  <g transform="translate(955 230)" filter="url(#shadow)">
    <rect x="0" y="0" rx="30" ry="30" width="530" height="110" fill="#b8fff0"/>
    <text x="34" y="68" class="tag">Source-Linked Menus</text>
  </g>
  <g transform="translate(1025 368)" filter="url(#shadow)">
    <rect x="0" y="0" rx="30" ry="30" width="395" height="110" fill="#f4f7fb"/>
    <text x="34" y="68" class="tag">Local Discovery</text>
  </g>

  <g transform="translate(300 430)">
    <line x1="250" y1="95" x2="500" y2="30" class="line"/>
    <line x1="250" y1="95" x2="535" y2="198" class="line"/>
    <line x1="250" y1="95" x2="45" y2="224" class="line"/>
    <line x1="500" y1="30" x2="535" y2="198" class="thinLine"/>
    <line x1="45" y1="224" x2="535" y2="198" class="thinLine"/>

    <g filter="url(#shadow)">
      <circle cx="250" cy="95" r="92" fill="#ffffff" opacity="0.95"/>
      <text x="204" y="104" class="tag">ML</text>
    </g>
    <g>
      <circle cx="500" cy="30" r="72" fill="#f7d794"/>
      <text x="459" y="38" class="nodeText">Menus</text>
    </g>
    <g>
      <circle cx="535" cy="198" r="78" fill="#b8fff0"/>
      <text x="489" y="206" class="tag">Food</text>
    </g>
    <g>
      <circle cx="45" cy="224" r="82" fill="#2f6f5f"/>
      <text x="-18" y="232" class="nodeText">People</text>
    </g>
  </g>

  <g transform="translate(118 760)">
    <rect x="0" y="0" rx="28" ry="28" width="660" height="72" fill="#ffffff" opacity="0.12"/>
    <text x="32" y="47" class="small">Verified active • Limited scope • Watchlist • Community-first</text>
  </g>

  <g transform="translate(1175 755)">
    <rect x="0" y="0" rx="28" ry="28" width="290" height="72" fill="#ffffff" opacity="0.12"/>
    <text x="34" y="47" class="small">South Shore, MA</text>
  </g>
</svg>
